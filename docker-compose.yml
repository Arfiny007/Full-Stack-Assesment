services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment_local
      POSTGRES_DB: production
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/02-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment -d production"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
