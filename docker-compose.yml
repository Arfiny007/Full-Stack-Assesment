services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: production
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/02-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment -d production"]
      interval: 3s
      timeout: 3s
      retries: 20
  mqtt-test:
    image: eclipse-mosquitto:2
    profiles: ["mqtt-test"]
    ports:
      - "127.0.0.1:18884:1883"
    volumes:
      - ./scripts/mosquitto-test.conf:/mosquitto/config/mosquitto.conf:ro
volumes:
  postgres_data:
